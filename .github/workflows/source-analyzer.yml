name: OG IPTV Source Analyzer V2

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Analyze Xtream metadata
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: python source_analyzer_v2.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: og-source-report-v2
          path: og_source_report_v2.json
          retention-days: 3
