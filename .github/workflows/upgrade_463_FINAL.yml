name: Upgrade OG IPTV to 4.6.3 FINAL
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply memory patch
        run: python upgrade_og_iptv_463_FINAL.py
      - name: Verify syntax
        run: python -m py_compile server.py
      - name: Commit updated server
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          git diff --cached --quiet || (git commit -m "OG IPTV 4.6.3 memory safety" && git push)
